name: Stage npm Release
run-name: Stage ${{ github.ref_name }}

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    outputs:
      package_name: ${{ steps.identity.outputs.package_name }}
      package_version: ${{ steps.identity.outputs.package_version }}
      tag_object_sha: ${{ steps.identity.outputs.tag_object_sha }}
    steps:
      - name: Require the fork release tag before checkout
        run: |
          if [[ ! "$GITHUB_REF" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo '::error::Dispatch this workflow at a vMAJOR.MINOR.PATCH tag'
            exit 1
          fi
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate package identity and verified signatures
        id: identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/release-validate-tag.sh

  pack:
    runs-on: ubuntu-24.04
    needs: validate
    env:
      EXPECTED_PACKAGE_VERSION: ${{ needs.validate.outputs.package_version }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.22.1
          package-manager-cache: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.6.0
          run_install: false
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run build
      - name: Pack and verify the exact release package
        run: node scripts/release-package.mjs pack package-artifact
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-package-${{ github.ref_name }}
          path: package-artifact/
          if-no-files-found: error
          retention-days: 1

  stage:
    runs-on: ubuntu-24.04
    needs: [validate, pack]
    permissions:
      contents: read
      id-token: write
    env:
      EXPECTED_PACKAGE_NAME: ${{ needs.validate.outputs.package_name }}
      EXPECTED_PACKAGE_VERSION: ${{ needs.validate.outputs.package_version }}
      EXPECTED_TAG_OBJECT_SHA: ${{ needs.validate.outputs.tag_object_sha }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package-${{ github.ref_name }}
          path: package-artifact
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.22.1
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      - name: Verify the downloaded package as data
        run: |
          set -euo pipefail
          mapfile -t TARBALLS < <(find package-artifact -maxdepth 1 -type f -name '*.tgz')
          if [[ "${#TARBALLS[@]}" -ne 1 ]]; then
            echo '::error::Expected exactly one package tarball'
            exit 1
          fi
          TARBALL="${TARBALLS[0]}"
          if [[ "$(jq 'length' package-artifact/PACK.json)" -ne 1 ||
                "$(jq -r '.[0].name' package-artifact/PACK.json)" != "$EXPECTED_PACKAGE_NAME" ||
                "$(jq -r '.[0].version' package-artifact/PACK.json)" != "$EXPECTED_PACKAGE_VERSION" ||
                "$(jq -r '.[0].filename' package-artifact/PACK.json)" != "$(basename "$TARBALL")" ]]; then
            echo '::error::npm pack report does not match the validated package'
            exit 1
          fi
          tar -tzf "$TARBALL" > "$RUNNER_TEMP/package-contents.txt"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const files = readFileSync(`${process.env.RUNNER_TEMP}/package-contents.txt`, 'utf8').trim().split('\n');
          assert.equal(new Set(files).size, files.length, 'Duplicate tarball entries');
          for (const file of files) {
            assert(/^package\/(?:dist\/|package\.json$|README(?:\.ja|\.ko|\.zh)?\.md$|LICENSE$|docs\/agent-conversations\.md$)/u.test(file), `Unexpected file: ${file}`);
            assert(!file.includes('/../') && !file.includes('\\'), 'Invalid tarball path');
            assert(!/(?:^|\/)(?:site|site-data|node_modules|\.env)(?:\/|$)/u.test(file), `Unexpected file: ${file}`);
            assert(!/\.(?:test|spec)\.[^/]+$/u.test(file), `Unexpected test file: ${file}`);
          }
          for (const file of ['package/package.json', 'package/README.md', 'package/LICENSE', 'package/docs/agent-conversations.md', 'package/dist/cli/index.js', 'package/dist/server/server.js', 'package/dist/client/index.html']) {
            assert(files.includes(file), `Missing runtime or attribution file: ${file}`);
          }
          assert(files.some((file) => /^package\/dist\/client\/assets\/.+\.js$/u.test(file)), 'Missing client JavaScript');
          assert(files.some((file) => /^package\/dist\/client\/assets\/.+\.css$/u.test(file)), 'Missing client stylesheet');
          const report = JSON.parse(readFileSync('package-artifact/PACK.json', 'utf8'))[0];
          assert.deepEqual([...files].sort(), report.files.map(({ path }) => `package/${path}`).sort());
          NODE
          EMBEDDED_JSON="$(tar -xOf "$TARBALL" package/package.json)"
          if [[ "$(jq -r '.name' <<< "$EMBEDDED_JSON")" != "$EXPECTED_PACKAGE_NAME" ||
                "$EXPECTED_PACKAGE_NAME" != @photostructure/difit ||
                "$(jq -r '.version' <<< "$EMBEDDED_JSON")" != "$EXPECTED_PACKAGE_VERSION" ||
                "$(jq -r '.repository.url' <<< "$EMBEDDED_JSON")" != "https://github.com/$GITHUB_REPOSITORY.git" ||
                "$(jq -r '.bin.difit' <<< "$EMBEDDED_JSON")" != ./dist/cli/index.js ]]; then
            echo '::error::Embedded package identity does not match the validated release'
            exit 1
          fi
      - name: Recheck the signed tag and stage the exact package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REF_JSON="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME")"
          if [[ "$(jq -r '.object.type' <<< "$REF_JSON")" != tag || "$(jq -r '.object.sha' <<< "$REF_JSON")" != "$EXPECTED_TAG_OBJECT_SHA" ]]; then
            echo '::error::Release tag changed after validation'
            exit 1
          fi
          TAG_JSON="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$EXPECTED_TAG_OBJECT_SHA")"
          COMMIT_VERIFIED="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA" --jq '.commit.verification.verified')"
          if [[ "$(jq -r '.object.type' <<< "$TAG_JSON")" != commit || "$(jq -r '.object.sha' <<< "$TAG_JSON")" != "$GITHUB_SHA" || "$(jq -r '.verification.verified' <<< "$TAG_JSON")" != true || "$COMMIT_VERIFIED" != true ]]; then
            echo '::error::Release tag moved or lost a verified signature'
            exit 1
          fi
          mapfile -t TARBALLS < <(find package-artifact -maxdepth 1 -type f -name '*.tgz')
          [[ "${#TARBALLS[@]}" -eq 1 ]]
          npm stage publish "./${TARBALLS[0]}" --ignore-scripts --access public
