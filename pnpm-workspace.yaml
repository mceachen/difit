packages:
  - .
  - packages/*
allowBuilds:
  '@parcel/watcher': true
  '@vscode/vsce-sign': true
  esbuild: true
  keytar: true
  lefthook: true

onlyBuiltDependencies:
  - '@parcel/watcher'
  - '@vscode/vsce-sign'
  - esbuild
  - keytar
  - lefthook

minimumReleaseAge: 20160

# Mermaid uses the stable renderToString API; keep its math renderer on a patched version.
overrides:
  'mermaid>katex': 0.18.2
